name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 2.0.5)'
        required: false
        default: ''
  push:
    branches:
      - 'hotfix/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure APK signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > orion-release.keystore
            test -s orion-release.keystore
            cat > keystore.properties <<EOF
          storeFile=orion-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo 'mode=release-signed' >> "$GITHUB_OUTPUT"
          else
            rm -f keystore.properties orion-release.keystore
            echo 'Release signing secrets are not configured; Gradle will sign this test APK with the debug key.'
            echo 'mode=debug-signed' >> "$GITHUB_OUTPUT"
          fi

      - name: Build release variant APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: orion-store-release-apk-${{ steps.signing.outputs.mode }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
